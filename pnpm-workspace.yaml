packages:
  - "packages/*"

patchedDependencies:
  "@cloudflare/ci@0.2.0": patches/@cloudflare__ci@0.2.0.patch
  "@cloudflare/vite-plugin@1.62.4": patches/@cloudflare__vite-plugin@1.62.4.patch
  "@earendil-works/pi-env@1.5.0": patches/@earendil-works__pi-env@1.5.0.patch
  miniflare@5.20261001.0-alpha: patches/miniflare@5.20261001.0-alpha.patch
  wrangler@4.146.0: patches/wrangler@4.146.0.patch

# @cloudflare/ci pins @cloudflare/sandbox exactly. Keep it on the same 0.12.x release as packages/build and its Dockerfile image, so the CiSandbox Durable Object, Build's own Sandbox calls and the container image run one SDK version. Revisit when @cloudflare/ci is upgraded.
overrides:
  "@cloudflare/ci>@cloudflare/sandbox": 0.12.14

# Enforce the Node version floor declared in package.json.
engineStrict: true

# Install explicitly before running tasks. pnpm's automatic dependency repair races when Turbo starts multiple tasks concurrently.
verifyDepsBeforeRun: false

# Keep dependency updates aligned with pnpm's one-day release-age policy using ncu --cooldown 1d. Any temporary minimumReleaseAgeExclude must name the exact third-party version and be removed after it clears the window.

# Each dependency with an install script needs an explicit verdict: true runs it, false keeps it unrun. esbuild installs its platform binary; msw installs its test worker. The parser packages use their packaged binaries.
# Enable a disabled script only with evidence that its build is required.
allowBuilds:
  "@google/genai": false
  protobufjs: false
  "@mongodb-js/zstd": false
  "@polar-sh/cli": true
  core-js-pure: false
  node-liblzma: false
  workerd: false
  esbuild: true
  msw: true
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false

# First-party releases are usable immediately; third-party exceptions stay version-specific.
minimumReleaseAgeExclude:
  - "@usecontextlayer/*"

permissions:
  "@better-auth-ui/core":
    skills: true
  "@better-auth-ui/react":
    skills: true

# pnpm links approved dependency skills into the skills store only; skills-sync builds the .claude/skills view from the store.
skills:
  dirs:
    - .agents/skills
